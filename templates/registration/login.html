{% extends 'base.html' %}

{% block title %}Login - CreatorOS{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="card-panel">
        <div class="panel-header" style="justify-content: center; margin-bottom: 1.5rem;">
            <h1 class="panel-title" style="font-size: 1.5rem; font-weight: 700;">
                <i class="fa-solid fa-lock" style="color: var(--accent-primary); margin-right: 0.5rem;"></i> Login to CreatorOS
            </h1>
        </div>

        {% if form.errors %}
        <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; padding: 0.75rem; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: 0.85rem;">
            Invalid username or password. Please try again.
        </div>
        {% endif %}

        <div style="margin-bottom: 1.5rem; text-align: center;">
            <a href="{% url 'core:google_login' %}" class="btn-secondary" style="width: 100%; justify-content: center; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; font-weight: 600; padding: 0.75rem; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 0.5rem; text-decoration: none;">
                <i class="fa-brands fa-google" style="color: #4285F4; font-size: 1.1rem;"></i> Continue with Google
            </a>
            <div style="display: flex; align-items: center; margin: 1.2rem 0; color: var(--text-muted); font-size: 0.8rem;">
                <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1);"></div>
                <span style="padding: 0 0.8rem;">OR</span>
                <div style="flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1);"></div>
            </div>
        </div>

        <form method="POST" class="quick-draft-form">
            {% csrf_token %}
            <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 0.3rem;">Username</label>
            <input type="text" name="username" placeholder="Username" required autofocus>

            <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 0.3rem;">Password</label>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 0.5rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>


        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
            Don't have an account? <a href="{% url 'core:register' %}" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}
